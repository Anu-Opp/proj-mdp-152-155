      
- name: Create Kubernetes Cluster
  hosts: localhost
  tasks:
    - name: Create cluster
      shell: |
        export KOPS_STATE_STORE=s3://anu-kops-state-store # <<< personalize bucket name
        kops create cluster \
          --name dev.k8s.local \
          --zones us-east-1a,us-east-1b \
          --node-count 2 \
          --node-size t2.medium \
          --master-size t2.medium \
          --dns-zone=dev.k8s.local \
          --yes

    - name: Wait for cluster to be ready
      command: kops validate cluster --name={{ cluster_name }}
      register: result
      until: result.rc == 0
      retries: 20
      delay: 60
      environment:
        KOPS_STATE_STORE: "{{ state_store }}"